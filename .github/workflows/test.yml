# Same oracle as the local gate, from a clean checkout (VERIFY-CONTRACT rule 8).
# Zero dependencies: no install step and no cache input — there is no lockfile.
name: test

on:
  push:
    tags-ignore: ['**'] # chore consolidation 2026-11-09 (ledger :118): no tag double-run
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Documented floor >= 18 (AGENTS.md:25) plus the current tip (ledger :117).
        node-version: [18, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: ./run_tests.sh
