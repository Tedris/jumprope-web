# night.conf — knobs for the night loop. Sourced by night_loop.sh.
# All values are env-overridable: launch with `NIGHT_MAX_ITERS=3 nightkit go .`

# Machine gate: any command exiting 0 = green. Run per iteration AND as
# baseline preflight. Per-item override: tools/night/gates/<ID>.sh (executable).
NIGHT_GATE="${NIGHT_GATE:-node --test tests/}"

# Paths/globs the worker must never modify; touching them = instant red
# (guards the agent against weakening its own oracle). Space-separated.
# Example: NIGHT_PROTECT="tests/ .github/ package.json run_tests.sh"
NIGHT_PROTECT="${NIGHT_PROTECT:-tests/boundary.test.js tests/game.test.js tests/headless-sim.test.js tests/shell.test.js tests/catalogue.test.js tests/pickflow.test.js package.json index.html}"

# Budgets
NIGHT_MAX_ITERS="${NIGHT_MAX_ITERS:-40}"      # iteration cap (0 = dry-run: preflight only)
NIGHT_MAX_HOURS="${NIGHT_MAX_HOURS:-8}"       # wall-clock budget
NIGHT_ITER_TIMEOUT="${NIGHT_ITER_TIMEOUT:-1800}"  # per-iteration seconds
NIGHT_FAIL_LIMIT="${NIGHT_FAIL_LIMIT:-2}"     # red attempts before BLOCKED
NIGHT_SLEEP_FAIL="${NIGHT_SLEEP_FAIL:-60}"    # seconds rest between failed attempts

# Worker (opencode) model override, provider/model format; empty = opencode default
NIGHT_MODEL="${NIGHT_MODEL:-}"
